[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cagerail"
version = "0.1.0"
description = "The cage for trading bots and AI agents: position limits, loss brakes and kill switches as a drop-in guard layer."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "jacelovehaha" }]
keywords = ["trading-bot", "risk-management", "ai-agents", "kill-switch", "position-sizing", "algo-trading", "guardrails"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.scripts]
cagerail = "cagerail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
